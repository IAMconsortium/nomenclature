# This workflow installs the package and runs the tests with pandas <3
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: pytest-legacy

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

jobs:
  pytest-legacy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    #----------------------------------------------
    #  -----  install & configure poetry  -----
    #----------------------------------------------
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    #----------------------------------------------
    # resolve pandas 2 dependencies for this job
    #----------------------------------------------
    - name: Resolve dependencies with pandas 2
      run: poetry add "pandas@>=2.2,<3" --lock

    #----------------------------------------------
    # install the library and test dependencies
    #----------------------------------------------
    - name: Install library and test dependencies
      run: poetry install --no-interaction --with dev

    - name: Test with pytest
      run: poetry run pytest tests
